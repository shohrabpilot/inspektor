# Copied from coil
name: CI
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - latest
  pull_request:
concurrency:
  # Limit concurrency to 1 for PRs. 'main' concurrency isn't limited.
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CI: true
  JAVA_VERSION: 17
  ORG_GRADLE_IDE_DOWNLOADJAVADOC: false
  ORG_GRADLE_IDE_DOWNLOADSOURCES: false
jobs:
  checks:
    name: Checks
    runs-on: macos-latest
    timeout-minutes: 30
    if: false # https://github.com/Kotlin/binary-compatibility-validator/issues/261
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Check Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      #      - name: Check style
      #        run: ./gradlew spotlessCheck

      - name: Check lint
        run: ./gradlew lint

      - name: Check binary compatibility
        run: ./gradlew apiCheck || { exit_code=$?; printf "*** This PR changes Inspektor's public API. If this change is intentional, run './gradlew apiDump' and commit the new API files. ***"; exit $exit_code; }

  unit-tests:
    name: Unit tests
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      - name: Remove unused Xcode versions
        if: false
        run: |
          echo "Currently installed Xcode versions:"
          find /Applications -name "Xcode*" -maxdepth 1 -mindepth 1
          echo "Removing all except the currently selected Xcode version..."
          ls -d /Applications/Xcode* | grep -v "$(xcode-select -p | sed 's:/Contents/Developer::')" | xargs -P 3 -I {} sudo rm -rf "{}"
          echo "Available Xcode versions after removal:"
          find /Applications -name "Xcode*" -maxdepth 1 -mindepth 1

      - name: Unit tests
        run: ./gradlew :inspektor:jvmTest

  instrumentation-tests:
    name: Instrumentation tests
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        api-level: [ 22, 26, 31 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      # API 30+ emulators only have x86_64 system images.
      - name: Get AVD info
        uses: ./.github/actions/get-avd-info
        id: avd-info
        with:
          api-level: ${{ matrix.api-level }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ steps.avd-info.outputs.arch }}
          target: ${{ steps.avd-info.outputs.target }}
          script: mv .github/debug.keystore ~/.android; ./gradlew connectedDebugAndroidTest

  build-sample:
    name: Build sample
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      - name: Build Compose and View sample
        run: ./gradlew sample:assembleDebug

#      - name: Build iOS app
#        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  deploy-snapshot:
    name: Deploy
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.repository == 'shohrabpilot/inspektor' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/latest')
#    needs: [ checks, unit-tests, instrumentation-tests, build-sample ]
    needs: [ unit-tests, build-sample ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Prepare publish credentials
        env:
          RAW_SIGNING_KEY: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey || secrets.SIGNING_IN_MEMORY_KEY || secrets.SIGNING_KEY }}
          RAW_SIGNING_KEY_ID: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId || secrets.SIGNING_IN_MEMORY_KEY_ID || secrets.SIGNING_KEY_ID }}
          RAW_SIGNING_KEY_PASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword || secrets.SIGNING_IN_MEMORY_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          RAW_MAVEN_CENTRAL_USERNAME: ${{ secrets.SONATYPE_NEXUS_USERNAME || secrets.MAVEN_CENTRAL_USERNAME }}
          RAW_MAVEN_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_NEXUS_PASSWORD || secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${RAW_SIGNING_KEY:-}" ]] || missing+=("signing key")
          [[ -n "${RAW_MAVEN_CENTRAL_USERNAME:-}" ]] || missing+=("maven central username")
          [[ -n "${RAW_MAVEN_CENTRAL_PASSWORD:-}" ]] || missing+=("maven central password")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing publish secrets: ${missing[*]}"
            exit 1
          fi

          signing_key="${RAW_SIGNING_KEY//$'\r'/}"
          # Remove accidental surrounding quotes added while storing secrets.
          signing_key="${signing_key#\"}"
          signing_key="${signing_key%\"}"
          signing_key="${signing_key#\'}"
          signing_key="${signing_key%\'}"
          # Support secrets stored as a single line containing literal '\n'.
          signing_key="${signing_key//\\n/$'\n'}"

          if [[ "${signing_key}" != *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
            echo "::warning::Signing key does not look ASCII-armored. Attempting base64 decode."
            decoded="$(printf '%s' "${signing_key}" | base64 --decode 2>/dev/null || printf '%s' "${signing_key}" | base64 -D 2>/dev/null || true)"
            if [[ "${decoded}" == *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
              signing_key="${decoded}"
            fi
          fi

          if [[ "${signing_key}" != *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
            echo "::error::Invalid signing key format. Use full ASCII-armored private key from: gpg --export-secret-keys --armor <key-id>"
            exit 1
          fi

          key_fingerprint="$(gpg --batch --with-colons --import-options show-only --import <<< "${signing_key}" 2>/dev/null | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ -z "${key_fingerprint}" ]]; then
            echo "::warning::Could not parse key as-is. Trying to repair armored payload (drop checksum and normalize body)."
            body="$(printf '%s\n' "${signing_key}" \
              | sed -n '/^-----BEGIN PGP PRIVATE KEY BLOCK-----$/,/^-----END PGP PRIVATE KEY BLOCK-----$/p' \
              | sed '1d;$d' \
              | sed '/^[[:space:]]*$/d' \
              | sed '/^Version:/d;/^Comment:/d;/^Charset:/d;/^Hash:/d;/^MessageID:/d' \
              | sed '/^=/d' \
              | tr -d '[:space:]')"

            if [[ -n "${body}" ]]; then
              repaired_key="$(
                {
                  echo "-----BEGIN PGP PRIVATE KEY BLOCK-----"
                  echo
                  printf '%s' "${body}" | fold -w 64
                  echo
                  echo "-----END PGP PRIVATE KEY BLOCK-----"
                }
              )"
              repaired_fingerprint="$(gpg --batch --with-colons --import-options show-only --import <<< "${repaired_key}" 2>/dev/null | awk -F: '$1 == "fpr" { print $10; exit }')"
              if [[ -n "${repaired_fingerprint}" ]]; then
                signing_key="${repaired_key}"
                key_fingerprint="${repaired_fingerprint}"
                echo "::notice::Recovered signing key by rebuilding armored payload."
              fi
            fi
          fi
          if [[ -z "${key_fingerprint}" ]]; then
            echo "::error::Could not parse a valid private key fingerprint from signing key. Re-export with: gpg --export-secret-keys --armor <key-id>"
            exit 1
          fi
          echo "Using signing key fingerprint ending with ${key_fingerprint: -16}"

          if [[ -n "${RAW_SIGNING_KEY_ID:-}" ]]; then
            echo "::notice::Provided signing key id will be ignored. Gradle will resolve key id from the provided private key to avoid id mismatch issues."
          fi

          {
            echo "ORG_GRADLE_PROJECT_mavenCentralUsername=${RAW_MAVEN_CENTRAL_USERNAME}"
            echo "ORG_GRADLE_PROJECT_mavenCentralPassword=${RAW_MAVEN_CENTRAL_PASSWORD}"
            if [[ -n "${RAW_SIGNING_KEY_PASSWORD:-}" ]]; then
              echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=${RAW_SIGNING_KEY_PASSWORD}"
            fi
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF"
            printf '%s\n' "${signing_key}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Deploy
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
